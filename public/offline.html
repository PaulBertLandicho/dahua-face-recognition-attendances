<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline</title>
    <style>body{font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f8fafc;color:#0f172a} .card{padding:24px;border-radius:8px;background:#fff;box-shadow:0 6px 18px rgba(2,6,23,0.08);max-width:720px;text-align:center}</style>
  </head>
  <body>
    <div class="card">
      <h1 style="color:#237227;margin-bottom:8px;">Offline Attendance Scanner</h1>
      <p style="color:#64748b;margin-bottom:20px;font-size:14px;line-height:1.5;">You are currently in offline mode. The facial recognition scanner and attendance queue are available offline.</p>
      <a href="/" style="display:inline-block;padding:12px 24px;background:#237227;color:#fff;text-decoration:none;border-radius:12px;font-weight:bold;font-size:14px;">Open Attendance Scanner</a>
    </div>
    <script>
      // Auto-redirect to cached app shell if available
      if (window.location.pathname !== "/") {
        setTimeout(function() { window.location.href = "/"; }, 500);
      }
    </script>
  </body>
</html>
